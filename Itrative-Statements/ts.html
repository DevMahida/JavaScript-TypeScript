<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TS loop</title>

    <!-- bootstrap -->
    <link rel="stylesheet" href="./css/bootstrap.min.css">
</head>

<body>

    <h1 class="p-3">Loop Based Programs using TypeScript (Without Arrays)</h1>

    <hr>


    <section class="my-2">
        <div class="mx-5">

            <!-- reverse number -->
            <div class="data">
                <h3 id="q1"></h3>
                <p class="fw-bold mb-0" id="q1Value"></p>
                <p class="fw-bold mb-0" id="q1Ans"></p>
            </div>

            <hr>

            <!-- check palendrome -->
            <div class="data">
                <h3 id="q2"></h3>
                <p class="fw-bold mb-0" id="q2Value"></p>
                <p class="fw-bold mb-0" id="q2Ans"></p>
                <p class="fw-bold mb-0" id="q2Pal"></p>
            </div>

            <hr>

            <!-- fibonnaci -->
            <div class="data">
                <h3 id="q3"></h3>
                <p class="fw-bold mb-0" id="q3Value"></p>
                <ul class="fw-bold mb-0 list-unstyled d-flex gap-2" id="q3Ans">

                </ul>
            </div>

            <hr>
            
            <!-- factorial -->
            <div class="data">
                <h3 id="q4"></h3>
                <p class="fw-bold mb-0" id="q4Value"></p>
                <p class="fw-bold mb-0" id="q4Ans"></p>
            </div>

            <hr>
            
            <!-- isPrime -->
            <div class="data">
                <h3 id="q5"></h3>
                <p class="fw-bold mb-0" id="q5Value"></p>
                <p class="fw-bold mb-0" id="q5Ans"></p>
            </div>

            <hr>
            
            <!-- digit count -->
            <div class="data">
                <h3 id="q6"></h3>
                <p class="fw-bold mb-0" id="q6Value"></p>
                <p class="fw-bold mb-0" id="q6Ans"></p>

            </div>

            <hr>
            
            <!-- sum of digit  -->
            <div class="data">
                <h3 id="q7"></h3>
                <p class="fw-bold mb-0" id="q7Value"></p>
                <p class="fw-bold mb-0" id="q7Ans"></p>

            </div>

            <hr>
            
            <!-- Armstrong number  -->
            <div class="data">
                <h3 id="q8"></h3>
                <p class="fw-bold mb-0" id="q8Value"></p>
                <p class="fw-bold mb-0" id="q8Ans"></p>
                <p class="fw-bold mb-0" id="q8des"></p>
            </div>

            <hr>
            
            <!-- find power  -->
            <div class="data">
                <h3 id="q9"></h3>
                <p class="fw-bold mb-0" id="q9Value"></p>
                <p class="fw-bold mb-0" id="q9Ans"></p>
                <p class="fw-bold mb-0" id="q9des"></p>
            </div>

            <hr>
            
            <!-- Pattern  -->
            <div class="data">
                <h3 id="q10"></h3>
                <p class="fw-bold mb-0" id="q10Value"></p>
                <ul class="fw-bold mb-0 list-unstyled ms-5 ps-3" id="q10Ans"></ul>
            </div>

        </div>
    </section>

    <!-- js-task -->
    <script type="module" src="./js/js-test.js"></script>
</body>

</html>
