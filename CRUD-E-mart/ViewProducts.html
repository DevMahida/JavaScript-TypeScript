<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Products</title>

    <!-- remix cdn -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />

    <!-- bootstrap -->
    <link rel="stylesheet" href="./assets/css/bootstrap.min.css">

    <!-- css -->
    <link rel="stylesheet" href="./assets/css/style.css">

</head>

<body>
    <div class="d-flex">

        <aside class="aside bg-dark p-3 position-sticky sticky-top">

            <!-- website name -->
            <h1 class="text-light text-center p-0 m-0">E-mart</h1>

            <ul class="nav flex-column text-center mt-5 gap-4">
                <li class="nav-item">
                    <a class="nav-link text-light" href="./index.html">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light" href="./addProducts.html">Add Products</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light" id="Product-link" href="./ViewProducts.html">View Products</a>
                </li>
            </ul>

        </aside>

        <div class="bg-dark-grey flex-grow-1">

            <header class="bg-dark p-3 pe-5 text-white">
                <div class="container">

                    <div class="d-flex align-items-center justify-content-between">
                        <form class="d-flex align-items-center justify-content-between">
                            <div class="d-flex gap-3">
                                <input class="form-control" type="search" placeholder="Search" id="searchBox"
                                    name="search">
                                <button class="btn btn-outline-light" onclick="return searchFilter()">Search</button>
                            </div>

                        </form>
                        <div class="text-end">
                            <a href="./Cart.html">
                                <button type="button" class="btn btn-outline-light position-relative">
                                    <i class="ri-shopping-cart-2-line"></i>
                                    <span id="CartBadge"
                                        class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                                    </span>
                                </button>
                            </a>
                        </div>
                    </div>
                </div>
            </header>

            <main>

                <section class="">
                    <div class="container">
                        <h1 class="text-white position-relative z-2 mt-3 ms-4">Products</h1>
                        <p class="ms-4 small text-light" id="searchMessage"></p>

                        <div class="bg-dark p-3 m-4 rounded-3">
                            <div class="row g-3" id="ViewProducts">

                            </div>
                        </div>
                    </div>
                </section>

            </main>
        </div>
    </div>

    <!-- bootstrap js -->
    <script src="./assets/js/bootstrap.bundle.min.js"></script>

    <!-- index.js -->
    <script src="./assets/js/index.js"></script>
</body>

</html>
