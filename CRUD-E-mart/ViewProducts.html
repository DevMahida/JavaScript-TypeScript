<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Products</title>

    <!-- remix cdn -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />

    <!-- bootstrap -->
    <link rel="stylesheet" href="./assets/css/bootstrap.min.css">

    <!-- css -->
    <link rel="stylesheet" href="./assets/css/style.css">

</head>

<body>
    <div class="d-flex">

        <aside class="aside bg-dark p-3 position-sticky sticky-top">

            <!-- website name -->
            <h1 class="text-light text-center p-0 m-0">E-mart</h1>

            <ul class="nav flex-column text-center mt-5 gap-4">
                <li class="nav-item">
                    <a class="nav-link text-light" href="./index.html">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light" href="./addProducts.html">Add Products</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light" id="Product-link" href="./ViewProducts.html">View Products</a>
                </li>
            </ul>

        </aside>

        <div class="bg-dark-grey flex-grow-1">

            <header class="bg-dark p-3 pe-5 text-white">
                <div class="container">

                    <div class="d-flex align-items-center justify-content-between">

                        <div class="d-flex gap-3">
                            <form>
                                <div class="d-flex gap-3 align-items-center justify-content-between">
                                    <input class="form-control" type="search" placeholder="Search" id="searchBox"
                                        name="search">
                                    <button class="btn btn-outline-light"
                                        onclick="return searchFilter()">Search</button>
                                </div>
                            </form>

                            <div class="dropdown">
                                <button class="btn btn-outline-light " type="button" data-bs-toggle="dropdown"
                                    data-bs-auto-close="outside" aria-expanded="false">
                                    Filter
                                </button>
                                <ul class="dropdown-menu w-200px">
                                    <form method="post" class="p-3">

                                        <!-- sorted by price -->
                                        <div>
                                            <span class="fw-bolder">Sort By Price:</span>
                                            <div class="mt-3">
                                                <input type="radio" name="FilterView" value="LtoH" id="LtoH">
                                                <label for="LtoH">Low to High</label>
                                            </div>
                                            <div>
                                                <input type="radio" name="FilterView" value="HtoL" id="HtoL">
                                                <label for="HtoL">High to Low</label>
                                            </div>
                                        </div>

                                        <!-- sorted by alphabet -->
                                        <div class="mt-3">
                                            <span class="fw-bolder">Sort By Alphabet:</span>
                                            <div class="mt-3">
                                                <input type="radio" name="FilterView" value="AtoZ" id="AtoZ">
                                                <label for="AtoZ">A to Z</label>
                                            </div>
                                            <div>
                                                <input type="radio" name="FilterView" value="ZtoA" id="ZtoA">
                                                <label for="ZtoA">Z to A</label>
                                            </div>
                                        </div>

                                        <div class="mt-3">
                                            <button type="submit" data-bs-close="true" onclick="return FilterViews()" class="btn btn-outline-dark">Filter</button>
                                        </div>
                                    </form>

                                </ul>
                            </div>

                        </div>


                        <div class="text-end">
                            <a href="./Cart.html">
                                <button type="button" class="btn btn-outline-light position-relative">
                                    <i class="ri-shopping-cart-2-line"></i>
                                    <span id="CartBadge"
                                        class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                                    </span>
                                </button>
                            </a>
                        </div>
                    </div>
                </div>
            </header>

            <main>

                <section>
                    <div class="container">
                        <h1 class="text-white position-relative z-2 mt-3 ms-4">Products</h1>
                        <p class="ms-4 small text-light" id="searchMessage"></p>

                        <div class="bg-dark p-3 m-4 rounded-3">
                            <div class="row g-3" id="ViewProducts">

                            </div>
                        </div>
                    </div>
                </section>

            </main>
        </div>
    </div>

    <!-- Development version popperJS -->
    <script src="https://unpkg.com/@popperjs/core@2/dist/umd/popper.js"></script>

    <!-- bootstrap js -->
    <script src="./assets/js/bootstrap.bundle.min.js"></script>

    <!-- index.js -->
    <script src="./assets/js/index.js"></script>
</body>

</html>
