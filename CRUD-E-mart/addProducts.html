<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Mart</title>

    <!-- remix cdn -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />

    <!-- bootstrap -->
    <link rel="stylesheet" href="./assets/css/bootstrap.min.css">

    <!-- css -->
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>

    <div class="d-flex">
        <aside class="aside bg-dark p-3">

            <!-- website name -->
            <h1 class="text-light text-center p-0 m-0">E-mart</h1>

            <ul class="nav flex-column text-center mt-5 gap-4">
                <li class="nav-item">
                    <a class="nav-link text-light" href="./index.html">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light" href="./addProducts.html">Add Products</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light" id="Product-link" href="./ViewProducts.html">View Products</a>
                </li>
            </ul>

        </aside>
        <div class="bg-dark-grey flex-grow-1">

            <!-- <header class="bg-dark p-3 pe-5 text-white">
                <div class="container">
                    <div class="text-end">
                        <button class="btn btn-outline-light"><i class="ri-shopping-cart-2-line"></i></button>
                    </div>
                </div>
            </header> -->

            <main class="d-flex align-items-center justify-content-center mt-5">

                <section class="bg-dark text-light p-5 w-75">

                    <h1 class="h3 text-center">Add Your Product</h1>

                    <form onsubmit="return addItem(event)">

                        <!-- product name -->
                        <div class="mt-3">
                            <label for="Pname">Product Name</label>
                            <input type="text" class="form-control mt-1" name="Pname" id="Pname">
                        </div>

                        <!-- product Price -->
                        <div class="mt-3">
                            <label for="Pprice">Product Price</label>
                            <input type="text" class="form-control mt-1" name="Pprice" id="Pprice">
                        </div>

                        <!-- product description -->
                        <div class="mt-3">
                            <label for="Pdes">Product Description</label>
                            <textarea class="form-control" name="Pdes" id="Pdes" rows="5" cols="30"></textarea>
                        </div>

                        <!-- product img url -->
                        <div class="mt-3">
                            <label for="Purl">Product Image URL</label>
                            <input type="text" class="form-control mt-1" name="Purl" id="Purl">
                        </div>

                        <!-- add item -->
                        <div class="mt-3 text-center">
                            <button class="btn btn-primary">Add Item</button>
                        </div>
                    </form>
                </section>

            </main>
        </div>
    </div>

    <!-- bootstrap js -->
    <script src="./assets/js/bootstrap.bundle.min.js"></script>

    <!-- index.js -->
    <script src="./assets/js/index.js"></script>
</body>

</html>
