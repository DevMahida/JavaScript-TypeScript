<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskify - Task Management System</title>

    <!-- remix icon -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />

    <!-- bootstrap -->
    <link rel="stylesheet" href="./assets/css/bootstrap.min.css">

    <!-- css -->
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>

    <header class="bg-dark text-light p-3">
        <div class="container d-flex justify-content-between align-items-center">
            <h2>Taskify</h2>
            <ul class="nav">
                <li class="nav-item ">
                    <a class="nav-link text-light fs-5" href="./index.html">Home</a>
                </li>
                <li class="nav-item ">
                    <a class="nav-link text-light fs-5" href="./task.html">Tasks</a>
                </li>
            </ul>
        </div>
    </header>

    <main>

        <!-- form -->
        <section class="my-5">
            <div class="container ">
                <div class="bg-info-subtle p-3 form mx-auto rounded-4">
                    <h2 class="text-center">Add Tasks</h2>
                    <form class="" onsubmit="return addTask()" method="post">

                        <!-- title -->
                        <div class="mt-4">
                            <label class="fs-5" for="title">Title:</label>
                            <input class="form-control" type="text" name="title" id="title">
                        </div>

                        <!-- discription -->
                        <div class="mt-3">
                            <label class="fs-5" for="desc">Discription :</label>
                            <textarea class="form-control" name="desc" id="desc" cols="30" rows="5"></textarea>
                        </div>

                        <!-- priority -->
                        <div class="mt-3">
                            <label class="fs-5" for="priority">Priority :</label>
                            <select class="form-select" name="priority" id="priority">
                                <option value="">Select Priority</option>
                                <option value="low">Low</option>
                                <option value="medium">Medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>

                        <!-- date -->
                        <div class="mt-3">
                            <label class="fs-5" for="due-date">Due Date :</label>
                            <input class="form-control" type="date" name="due-date" id="due-date">
                        </div>

                        <!-- btn -->
                        <div class="mt-4 text-end">
                            <button class="btn btn-outline-dark" type="submit">Add</button>
                        </div>

                    </form>
                </div>
            </div>
        </section>


        <!-- task list -->
        <section class="my-5">
            <div class="container">
                <div class="task-list bg-info rounded-3 p-3">

                    <div class="d-flex justify-content-between">
                        <h3>Task List</h3>
                        
                        <div class="d-flex gap-2">
                            <select class="form-select" name="filter" id="filter">
                                <option value="">Filter by priority</option>
                                <option value="all">All</option>
                                <option value="low">Low</option>
                                <option value="medium">Medium</option>
                                <option value="high">High</option>
                            </select>
                            <button class="btn btn-dark" onclick="return Filter()">Filter</button>
                        </div>
                    </div>

                    <div class="row mt-4 g-3" id="showList">

                    </div>
                </div>
            </div>
            </div>
        </section>
    </main>


    <!-- bootstrap -->
    <script src="./assets/js/bootstrap.bundle.min.js"></script>

    <!-- script.js -->
    <script src="./assets/js/script.js"></script>
</body>

</html>
